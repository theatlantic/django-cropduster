name: Test

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - django-version: "4.2"
            python-version: "3.10"
          - django-version: "4.2"
            python-version: "3.12"
            grappelli: "1"
          - django-version: "5.0"
            python-version: "3.11"
          - django-version: "5.1"
            python-version: "3.12"
            grappelli: "1"
          - django-version: "5.2"
            python-version: "3.12"
          - django-version: "5.2"
            python-version: "3.12"
            toxenv: "py312-dj52-migrations"
          - django-version: "5.2"
            python-version: "3.12"
            toxenv: "py312-dj52-nested"
          - django-version: "5.2"
            python-version: "3.12"
            toxenv: "py312-dj52-noxmp"
          - django-version: "5.2"
            python-version: "3.12"
            toxenv: "py312-dj52-thumbor"
          - django-version: "5.2"
            python-version: "3.13"
            grappelli: "1"
            s3: "1"

    runs-on: ubuntu-latest
    name: Django ${{ matrix.django-version }} (Python ${{ matrix.python-version }})${{ matrix.grappelli == '1' && ' + grappelli' || '' }}${{ matrix.s3 == '1' && ' + s3' || '' }}${{ matrix.toxenv && format(' + {0}', matrix.toxenv) || '' }}
    env:
      PYTHON: ${{ matrix.python-version }}
      DJANGO: ${{ matrix.django-version }}
      GRAPPELLI: ${{ matrix.grappelli || '0' }}
      S3: ${{ matrix.s3 || '0' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NODE_ENV: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo .github/workflows/apt-get-update.sh
        sudo apt-get install -y exempi gifsicle

    - name: Install tox
      run: |
       python3 -m pip install tox tox-gh-actions

    # pytest-retry cannot retry failures from unittest's setUpClass phase,
    # which is where selenosis starts Chrome and the live server. Retry the
    # complete tox command once so setup failures receive a second attempt.
    # In-test Selenium failures still use pytest-retry.
    - name: Run tests
      run: |
        run_tests() {
          if [ -n "${{ matrix.toxenv }}" ]; then
            tox -e "${{ matrix.toxenv }}" -- -v --selenosis-driver=chrome-headless
          else
            tox -- -v --selenosis-driver=chrome-headless
          fi
        }
        run_tests || run_tests

    - name: Upload junit xml
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-reports-django-${{ matrix.django-version }}-python${{ matrix.python-version }}${{ matrix.grappelli == '1' && '-grappelli' || '' }}${{ matrix.s3 == '1' && '-s3' || '' }}${{ matrix.toxenv && format('-{0}', matrix.toxenv) || '' }}-${{ github.sha }}
        path: reports/*.xml
        overwrite: true

    - name: Combine coverage
      run: tox -e coverage-report

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        name: ${{ github.workflow }}
        files: .tox/coverage/coverage.xml
        env_vars: "DJANGO,GRAPPELLI,PYTHON,S3"
        token: ${{ secrets.CODECOV_TOKEN }}

  report:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    name: "Report Test Results"
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish Unit Test Results
        if: always()
        uses: mikepenz/action-junit-report@1a91e26932fb7ba410a31fab1f09266a96d29971
        with:
          report_paths: ./*.xml
          require_tests: true
          fail_on_failure: true
          check_name: Test Report
          github_token: ${{ secrets.GITHUB_TOKEN }}

  success:
    needs: [report]
    runs-on: ubuntu-latest
    name: Test Successful
    steps:
      - name: Success
        run: echo Test Successful
