name: Beta

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: beta-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch beta update
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_ACTION: ${{ github.event.action }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # This workflow runs with access to a private-repository token, so it
      # must not check out or run pull request code.
      - name: Dispatch beta update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ATLANTIC_ACCESS_REPO_TOKEN }}
          script: |
            const eventType = process.env.PR_ACTION === "closed"
              ? "delete-django-cropduster-beta"
              : "deploy-django-cropduster-beta";

            await github.rest.repos.createDispatchEvent({
              owner: "theatlantic",
              repo: "django-cropduster-infra",
              event_type: eventType,
              client_payload: {
                source_repository: process.env.SOURCE_REPOSITORY,
                source_branch: process.env.SOURCE_BRANCH,
                pr_number: process.env.PR_NUMBER,
                git_sha: process.env.SOURCE_SHA,
              },
            });
