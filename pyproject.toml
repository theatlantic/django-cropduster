[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cropduster"
dynamic = ["version"]
authors = [
  { name="The Atlantic", email="programmers@theatlantic.com" },
]
description = "Django image uploader and cropping tool"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
]
license = "BSD-2-Clause"
dependencies = [
    "Django>=4.2",
    "Pillow>=9",
    "django-generic-plus>=4.0.0,<5",
]

[project.optional-dependencies]
# Standalone mode stores crop geometry in XMP metadata and needs both libxmp
# and the exempi shared library alongside it.
standalone = [
    "python-xmp-toolkit",
]
# ThumborRenderer signs its URLs with libthumbor; nothing else imports it.
thumbor = [
    "libthumbor>=2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cropduster*"]
namespaces = false

[tool.setuptools.package-data]
cropduster = ["**/templates/**/*", "**/static/**/*"]

[tool.setuptools.dynamic]
version = {attr = "cropduster.__version__"}

[project.urls]
Homepage = "https://github.com/theatlantic/django-cropduster"
Documentation = "https://django-cropduster.readthedocs.io/"
Changelog = "https://github.com/theatlantic/django-cropduster/blob/master/CHANGELOG.rst"
Issues = "https://github.com/theatlantic/django-cropduster/issues"

[tool.uv.workspace]
members = ["demo"]
