# Build the current documentation on Read the Docs. The project must also be
# configured to build `master` as "latest" and keep its GitHub webhook active;
# otherwise https://django-cropduster.readthedocs.io/ will continue to serve
# the 4.8.18 documentation.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
